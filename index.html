<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7ef">
  <title>一起学英语</title>
  <link rel="stylesheet" href="style.css">
  <script src="words.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><span class="logo" aria-hidden="true">A</span><span>一起学英语</span><span class="today">每天一点点</span></header>
    <section class="welcome"><p class="eyebrow">GOOD TO SEE YOU</p><h1>今天也来学一点吧 <span>✦</span></h1><p>和妹妹一起，把英语变成每天的小习惯。</p></section>
    <section class="progress panel" aria-labelledby="progress-title">
      <div class="section-heading"><div><p class="eyebrow">YOUR DAILY GOAL</p><h2 id="progress-title">今日六级学习进度</h2></div><span class="progress-count"><b id="progress-count">0</b> / <span id="total-count">50</span> 词</span></div>
      <div class="progress-track" role="progressbar" aria-label="今日学习进度" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><span id="progress-fill"></span></div>
      <div class="stats"><span>已学习 <b id="studied-count">0</b></span><span>认识 <b id="known-count">0</b></span><span>再复习 <b id="review-count">0</b></span></div>
    </section>
    <section class="study" aria-labelledby="word-title">
      <div class="study-label"><span id="study-level-label">今日六级单词</span><span id="word-position">01 / 50</span></div>
      <article class="word-card panel">
        <span class="word-mark" aria-hidden="true">✳</span><p class="part-of-speech" id="word-type">名词 · noun</p><h2 id="word-title">curious</h2><p class="pronunciation" id="word-pronunciation">/ˈkjʊəriəs/</p>
        <button class="meaning-toggle" id="meaning-toggle" type="button" aria-expanded="false">显示中文释义 <span aria-hidden="true">＋</span></button>
        <p class="meaning" id="meaning" hidden>好奇的；求知欲强的</p>
        <p class="example" id="word-example">Children are naturally curious about the world.</p>
      </article>
      <p class="feedback-label">你对这个词的熟悉程度是？</p>
      <div class="feedback" role="group" aria-label="单词熟悉程度"><button type="button" data-rating="known" class="rating known">认识</button><button type="button" data-rating="fuzzy" class="rating fuzzy">模糊</button><button type="button" data-rating="unknown" class="rating unknown">不认识</button></div>
      <button class="next-button" id="next-button" type="button">下一个单词 <span aria-hidden="true">→</span></button>
      <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
    </section>
    <footer>慢慢来，每一个新单词都算数。 <span>🌱</span></footer>
  </main>
</body>
</html>
